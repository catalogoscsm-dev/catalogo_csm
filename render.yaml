services:
  - type: web
    name: csm-decor-catalogo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir webapp app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
