<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CSM — Catálogo{% endblock %}</title>
  <!-- Aplica tema antes do render para evitar flash -->
  <script>
    (function(){
      if(localStorage.getItem('theme')==='dark') document.documentElement.classList.add('dark');
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cream:  { DEFAULT: '#FAFAF8', dark: '#F5F0EA' },
            gold:   { DEFAULT: '#FF7D00', dark: '#CC6400', light: '#FFD4A8', subtle: '#FF7D0020' },
            ink:    { DEFAULT: '#1a1a1a', soft: '#3d3d3d', muted: '#6b6b6b', faint: '#b0a898' },
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans:  ['"Inter"', 'ui-sans-serif', 'system-ui'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Variáveis de tema ────────────────────────────────────────────── */
    :root {
      --bg:          #FAFAF8;
      --bg-card:     #ffffff;
      --bg-input:    #ffffff;
      --nav-bg:      rgba(250,250,248,0.97);
      --border:      #FFD4A8;
      --border-soft: rgba(255,212,168,0.5);
      --text:        #1a1a1a;
      --text-muted:  #b0a898;
      --text-soft:   #3d3d3d;
      --scroll-track:#F5F0EA;
      --spotlight:   rgba(255,125,0,0.15);
    }
    html.dark {
      --bg:          #111111;
      --bg-card:     #1c1c1c;
      --bg-input:    #1c1c1c;
      --nav-bg:      rgba(12,12,12,0.97);
      --border:      rgba(255,125,0,0.3);
      --border-soft: rgba(255,125,0,0.15);
      --text:        #f0ede8;
      --text-muted:  #8a8078;
      --text-soft:   #c8c0b8;
      --scroll-track:#1a1a1a;
      --spotlight:   rgba(255,125,0,0.22);
    }

    /* ── Base ─────────────────────────────────────────────────────────── */
    body {
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 600px;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, var(--spotlight) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    main { position: relative; z-index: 1; }

    /* ── Cards ────────────────────────────────────────────────────────── */
    .card-overlay { opacity: 0; transition: opacity .45s ease; }
    .card-wrap:hover .card-overlay { opacity: 1; }
    .card-img { transition: transform .6s ease; }
    .card-wrap:hover .card-img { transform: scale(1.06); }

    .csm-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* ── Inputs ───────────────────────────────────────────────────────── */
    .csm-input {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }
    .csm-input:focus {
      border-color: #FF7D00;
      box-shadow: 0 0 0 3px rgba(255,125,0,0.12);
      outline: none;
    }

    /* ── Navbar ───────────────────────────────────────────────────────── */
    .csm-nav {
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* ── Separador dourado ────────────────────────────────────────────── */
    .gold-rule {
      height: 1px;
      background: linear-gradient(to right, transparent, #FF7D00, transparent);
    }

    /* ── Toggle dark mode ─────────────────────────────────────────────── */
    .theme-toggle {
      width: 44px; height: 24px;
      background: var(--border);
      border-radius: 99px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s ease;
      flex-shrink: 0;
    }
    .theme-toggle::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.3s ease, background 0.3s ease;
      display: flex; align-items: center; justify-content: center;
    }
    html.dark .theme-toggle { background: #FF7D00; }
    html.dark .theme-toggle::after { transform: translateX(20px); }

    /* ── Scrollbar ────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--scroll-track); }
    ::-webkit-scrollbar-thumb { background: #FF7D0055; border-radius: 9px; }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">

<!-- ── Navbar ──────────────────────────────────────────────────────────── -->
<header class="csm-nav sticky top-0 z-50 backdrop-blur-sm">
  <div class="max-w-screen-xl mx-auto px-6 sm:px-10 flex items-center justify-between h-24">

    <a href="/" class="flex items-center gap-4">
      <img src="/static/logo.png" alt="CSM" id="nav-logo" style="height:80px; width:auto; transition: filter 0.3s ease;">
      <span class="hidden sm:block" style="width:1px; height:18px; background:var(--border);"></span>
      <span class="hidden sm:block text-[10px] tracking-[0.25em] uppercase font-sans"
            style="color:var(--text-muted);">
        Catálogo de Produtos
      </span>
    </a>

    <nav class="flex items-center gap-5 text-xs font-sans">
      {% if session.role == 'admin' %}
      <span class="border border-gold text-gold px-2.5 py-1 rounded-full text-[10px] tracking-widest uppercase font-medium"
            style="border-color:#FF7D00; color:#FF7D00;">
        Admin
      </span>
      <a href="/admin/reingest"
         class="transition-colors tracking-wider uppercase text-[10px]"
         style="color:var(--text-muted);"
         onmouseover="this.style.color='#FF7D00'" onmouseout="this.style.color='var(--text-muted)'">Sincronizar</a>
      <a href="/admin/review"
         class="transition-colors tracking-wider uppercase text-[10px]"
         style="color:var(--text-muted);"
         onmouseover="this.style.color='#FF7D00'" onmouseout="this.style.color='var(--text-muted)'">Fornecedores</a>
      {% endif %}

      <span class="hidden sm:inline tracking-wider text-[11px]" style="color:var(--text-muted);">{{ session.user }}</span>

      <!-- Toggle light/dark -->
      <button onclick="toggleTheme()" class="theme-toggle" title="Alternar tema" aria-label="Alternar tema claro/escuro"></button>

      <a href="/logout"
         class="transition-colors tracking-[0.2em] uppercase text-[10px]"
         style="color:var(--text-muted);"
         onmouseover="this.style.color='#FF7D00'" onmouseout="this.style.color='var(--text-muted)'">Sair</a>
    </nav>
  </div>
</header>

<!-- ── Conteúdo ────────────────────────────────────────────────────────── -->
<main class="max-w-screen-xl mx-auto px-6 sm:px-10 py-10">
  {% block content %}{% endblock %}
</main>

<!-- ── Rodapé ──────────────────────────────────────────────────────────── -->
<footer class="mt-20 py-8" style="border-top:1px solid var(--border);">
  <div class="gold-rule max-w-xs mx-auto mb-6"></div>
  <p class="text-center font-serif text-sm tracking-widest" style="color:var(--text-muted);">
    Campinas Shopping Móveis &mdash; Catálogo Interno &mdash; Uso Exclusivo
  </p>
</footer>

<script>
  function toggleTheme() {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }
</script>

</body>
</html>
