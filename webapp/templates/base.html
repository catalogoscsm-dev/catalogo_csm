<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CSM Decor — Catálogo{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT: '#B8960C', light: '#D4AF37', dark: '#8B6914' },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [x-cloak] { display: none !important; }
    .card-img { transition: transform .3s ease; }
    .card:hover .card-img { transform: scale(1.04); }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans antialiased">

<!-- Navbar -->
<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">
    <a href="/" class="flex items-center gap-2">
      <span class="text-lg font-bold tracking-tight text-gray-900">CSM <span class="text-gold">Decor</span></span>
      <span class="hidden sm:inline text-xs text-gray-400 font-normal">Catálogo de Produtos</span>
    </a>

    <div class="flex items-center gap-3 text-sm">
      {% if session.role == 'admin' %}
      <span class="inline-flex items-center gap-1 bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded text-xs font-medium">
        Admin
      </span>
      <a href="/admin/reingest" class="text-gray-400 hover:text-gray-600 text-xs" title="Reimportar novos produtos">↻ Sincronizar</a>
      <a href="/admin/review" class="text-gray-400 hover:text-gray-600 text-xs" title="Rever fornecedores">⚙ Fornecedores</a>
      {% endif %}
      <span class="text-gray-400 text-xs hidden sm:inline">{{ session.user }}</span>
      <a href="/logout" class="text-red-400 hover:text-red-600 font-medium">Sair</a>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
  {% block content %}{% endblock %}
</main>

<footer class="mt-16 py-8 border-t border-gray-200 text-center text-xs text-gray-400">
  CSM Decor &mdash; Catálogo interno &mdash; Uso exclusivo
</footer>

</body>
</html>
