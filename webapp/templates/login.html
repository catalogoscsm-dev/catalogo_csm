<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSM Decor — Acesso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { background-color: #FAFAF8; }
    .gold-rule {
      height: 1px;
      background: linear-gradient(to right, transparent, #FF7D00, transparent);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center" style="background:#FAFAF8;">

<div class="w-full max-w-sm mx-auto px-8">

  <!-- Marca -->
  <div class="text-center mb-10">
    <img src="/static/logo.png" alt="CSM" style="height:72px; width:auto; margin:0 auto 16px;">
    <div class="gold-rule max-w-[100px] mx-auto mb-3"></div>
    <p class="text-[10px] tracking-[0.3em] uppercase"
       style="color:#b0a898; font-family:'Inter',sans-serif;">Catálogo de Produtos</p>
  </div>

  <!-- Formulário -->
  <div class="rounded-2xl p-8" style="background:#1e1e1e; border:1px solid rgba(255,125,0,0.25); box-shadow:0 8px 40px rgba(255,125,0,0.08);">

    {% if error %}
    <div class="rounded-xl px-4 py-3 mb-6 text-sm font-sans text-center"
         style="background:#FEF2F2; border:1px solid #FECACA; color:#B91C1C;">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" class="space-y-5">
      <div>
        <label class="block text-[10px] tracking-[0.25em] uppercase mb-2 font-sans"
               style="color:#b0a898;">Usuário</label>
        <input
          name="username" type="text" autocomplete="username"
          required
          class="w-full rounded-xl px-4 py-3 text-sm font-sans outline-none transition-all"
          style="background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.15); color:#fff;"
          onfocus="this.style.borderColor='#FF7D00'; this.style.boxShadow='0 0 0 3px rgba(255,125,0,0.15)'"
          onblur="this.style.borderColor='rgba(255,255,255,0.15)'; this.style.boxShadow='none'"
          placeholder="Digite seu usuário"
        >
      </div>
      <div>
        <label class="block text-[10px] tracking-[0.25em] uppercase mb-2 font-sans"
               style="color:#b0a898;">Senha</label>
        <input
          name="password" type="password" autocomplete="current-password"
          required
          class="w-full rounded-xl px-4 py-3 text-sm font-sans outline-none transition-all"
          style="background:#FAFAF8; border:1px solid #FFD4A8; color:#1a1a1a;"
          onfocus="this.style.borderColor='#FF7D00'; this.style.boxShadow='0 0 0 3px rgba(255,125,0,0.15)'"
          onblur="this.style.borderColor='#FFD4A8'; this.style.boxShadow='none'"
        >
      </div>
      <button
        type="submit"
        class="w-full py-3 rounded-xl text-[11px] tracking-[0.3em] uppercase font-medium font-sans
               transition-all mt-2"
        style="background:#FF7D00; color:#fff;"
        onmouseover="this.style.background='#CC6400'"
        onmouseout="this.style.background='#FF7D00'"
      >
        Entrar
      </button>
    </form>
  </div>

  <p class="text-center text-[10px] tracking-widest uppercase mt-8 font-sans" style="color:#b0a898;">
    Acesso restrito &mdash; uso interno
  </p>
</div>

</body>
</html>
