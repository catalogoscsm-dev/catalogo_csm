<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSM Decor — Acesso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { colors: { gold: { DEFAULT: '#B8960C', light: '#D4AF37' } } } }
    }
  </script>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center font-sans antialiased">

<div class="w-full max-w-sm mx-auto px-6">

  <!-- Logo -->
  <div class="text-center mb-10">
    <h1 class="text-3xl font-bold text-white tracking-tight">
      CSM <span class="text-yellow-400">Decor</span>
    </h1>
    <p class="text-gray-500 text-sm mt-1">Catálogo de Produtos</p>
  </div>

  <!-- Card -->
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
    <h2 class="text-white font-semibold mb-6 text-center">Identificação</h2>

    {% if error %}
    <div class="bg-red-900/40 border border-red-700 text-red-300 text-sm px-4 py-3 rounded-lg mb-5">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      <div>
        <label class="block text-gray-400 text-xs font-medium mb-1.5">Usuário</label>
        <input
          name="username"
          type="text"
          autocomplete="username"
          class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2.5 text-sm
                 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent
                 placeholder:text-gray-600"
          placeholder="admin ou cliente"
          required
        >
      </div>
      <div>
        <label class="block text-gray-400 text-xs font-medium mb-1.5">Senha</label>
        <input
          name="password"
          type="password"
          autocomplete="current-password"
          class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2.5 text-sm
                 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent"
          required
        >
      </div>
      <button
        type="submit"
        class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-semibold
               rounded-lg py-2.5 text-sm transition-colors mt-2"
      >
        Entrar
      </button>
    </form>
  </div>

  <p class="text-center text-gray-700 text-xs mt-6">Acesso restrito — uso interno</p>
</div>

</body>
</html>
