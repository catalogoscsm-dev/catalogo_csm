[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "csm-catalog-extractor"
version = "1.0.0"
description = "Pipeline de extração de catálogos de móveis planejados — CSM Decor"
requires-python = ">=3.10"

dependencies = [
    # PDF → Imagem
    "PyMuPDF>=1.23.0",

    # IA de visão (bboxes)
    "anthropic>=0.34.0",

    # Web app
    "flask>=3.0.0",

    # Processamento de imagem
    "Pillow>=10.0.0",
    "colorthief>=0.2.1",

    # Utilitários
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
